name: Debug Build (Android APK)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '빌드 모드'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - profile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --${{ inputs.build_mode }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soul-dungeon-${{ inputs.build_mode }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_mode }}.apk
          retention-days: 14
